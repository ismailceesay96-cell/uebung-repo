<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Referenzen</title>
<style>
  :root{ --noir:#0a0908; --gold:#c9a24b; --gold-bright:#e8c77a; --ink:#ece3d1; --dim:#b6ab92; }
  *{ box-sizing:border-box; } html,body{ margin:0; height:100%; }
  body{ background:var(--noir); color:var(--ink); font-family:system-ui,-apple-system,sans-serif;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2.5rem; padding:2rem; text-align:center; }
  h1{ font-weight:400; letter-spacing:.3em; text-transform:uppercase; font-size:.9rem; color:var(--gold); margin:0; }
  .grid{ display:flex; gap:1.5rem; flex-wrap:wrap; justify-content:center; }
  a.card{ display:block; width:280px; max-width:80vw; padding:2.5rem 2rem; text-decoration:none; color:var(--ink);
    border:1px solid rgba(201,162,75,.3); border-radius:4px; background:rgba(201,162,75,.04);
    transition:transform .3s ease, border-color .3s ease; }
  a.card:hover{ transform:translateY(-6px); border-color:var(--gold); }
  .card h2{ margin:0 0 .5rem; font-weight:500; font-size:1.5rem; color:var(--gold-bright); }
  .card p{ margin:0; color:var(--dim); font-size:.95rem; }
</style>
</head>
<body>
  <h1>Referenzen</h1>
  <div class="grid">
    <a class="card" href="paradise-saal/"><h2>Paradise Saal</h2><p>Event-Location · Hochzeiten &amp; Feiern</p></a>
    <a class="card" href="freecut-salon/"><h2>Freecut Salon</h2><p>Salon-Website</p></a>
  </div>
</body>
</html>
